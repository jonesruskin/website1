name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never needs to write, and it never runs with secrets
# on pull requests from forks (no pull_request_target).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI has no production secrets; the build is checked, not deployed.
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"; echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"; echo "install=yarn install --immutable" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"; echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ${{ steps.pm.outputs.name }}

      - run: corepack enable
        if: steps.pm.outputs.name == 'yarn'

      - name: Install
        run: ${{ steps.pm.outputs.install }}

      - name: Lint
        run: ${{ steps.pm.outputs.name }} run lint

      - name: Typecheck
        run: ${{ steps.pm.outputs.name }} run typecheck

      - name: Test
        run: ${{ steps.pm.outputs.name }} run --if-present test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'yarn.lock') }}-${{ hashFiles('src/**', 'content/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'yarn.lock') }}-

      - name: Build
        run: ${{ steps.pm.outputs.name }} run build
